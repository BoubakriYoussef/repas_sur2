name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main","test" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/repas_sur_backend2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build, test and dependency audit (Spring Boot)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw clean verify
      - name: Publish OWASP Dependency-Check report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-dependency-check-report
          path: |
            backend/repas_sur_backend2/target/dependency-check-report.html
            backend/repas_sur_backend2/target/dependency-check-report.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/repas_sur_frontend2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/repas_sur_frontend2/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Test (Angular)
        run: npm run test -- --watch=false --browsers=ChromeHeadless
      - name: Build (Angular)
        run: npm run build -- --configuration=production
