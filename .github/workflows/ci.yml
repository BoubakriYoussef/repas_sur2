name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main","test" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/repas_sur_backend2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build & test (Spring Boot)
        run: ./mvnw clean test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/repas_sur_frontend2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/repas_sur_frontend2/package-lock.json
      - name: Install
        run: npm ci
      - name: Test (Angular)
        run: npm run test -- --watch=false --browsers=ChromeHeadless
      - name: Build (Angular)
        run: npm run build -- --configuration=production
