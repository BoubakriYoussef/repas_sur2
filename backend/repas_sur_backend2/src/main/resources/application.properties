spring.application.name=repas_sur_backend
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/repas_sur}
spring.datasource.username=${DB_USERNAME:repas_user}
spring.datasource.password=${DB_PASSWORD:repas_pass}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

security.jwt.secret=${JWT_SECRET:change-me-in-env-base64}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.liquibase=INFO
