services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repas_sur}
      POSTGRES_USER: ${POSTGRES_USER:-repas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app

  backend:
    build:
      context: ./backend/repas_sur_backend2
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-repas_sur}
      DB_USERNAME: ${POSTGRES_USER:-repas_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      - db
    networks:
      - app
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./frontend/repas_sur_frontend2
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app
    ports:
      - "80:80"

  prometheus:
    image: prom/prometheus:v3.11.3
    restart: unless-stopped
    depends_on:
      - backend
      - alertmanager
      - blackbox-exporter
    networks:
      - app
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.32.1
    restart: unless-stopped
    networks:
      - app
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    networks:
      - app
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - app
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    networks:
      - app
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  db_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  app:
    driver: bridge
