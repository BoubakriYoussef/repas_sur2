<div class="min-h-screen">
  <div class="md:hidden flex items-center justify-between px-4 py-4 bg-card/80 backdrop-blur border-b border-stroke">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 rounded-xl bg-night text-white flex items-center justify-center font-semibold">SM</div>
      <div>
        <p class="text-xs text-muted">Repas Sûr</p>
        <p class="app-title text-base font-semibold">Pilotage</p>
      </div>
    </div>
    <a class="text-sm font-semibold text-accent" routerLink="/login">Connexion</a>
  </div>

  <div class="md:flex">
    <aside class="hidden md:flex flex-col w-72 min-h-screen border-r border-stroke bg-card/70 backdrop-blur px-6 py-6">
      <div class="flex items-center gap-3">
        <div class="h-11 w-11 rounded-2xl bg-night text-white flex items-center justify-center font-semibold">RS</div>
        <div>
          <p class="text-xs text-muted">RepasSûr</p>
          <p class="app-title text-lg font-semibold">Console</p>
        </div>
      </div>

      <nav class="mt-10 space-y-2">
        <a
          *ngFor="let item of nav"
          [routerLink]="item.route"
          routerLinkActive="bg-night text-white"
          class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-ink/80 hover:bg-night hover:text-white transition"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path [attr.d]="item.icon"></path>
          </svg>
          <span>{{ item.label }}</span>
        </a>
      </nav>

      <div class="mt-auto pt-8">
        <div class="rounded-2xl border border-stroke p-4 bg-white/70">
          <p class="text-xs text-muted">Statut securite</p>
          <p class="text-sm font-semibold">Aucun incident critique</p>
          <div class="mt-3 h-2 rounded-full bg-stroke">
            <div class="h-2 rounded-full bg-accent" style="width: 82%"></div>
          </div>
        </div>
      </div>
    </aside>

    <div class="flex-1">
      <header class="px-6 py-6 md:px-10 md:py-8">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <div>
            <p class="text-xs uppercase tracking-[0.2em] text-muted">Restauration collective</p>
            <h1 class="app-title text-2xl md:text-3xl font-semibold">Surveillance des risques</h1>
          </div>
          <div class="flex items-center gap-3">
            <div class="hidden md:flex items-center gap-2 rounded-full border border-stroke bg-white/80 px-4 py-2">
              <span class="text-xs text-muted">Recherche</span>
              <input class="bg-transparent text-sm outline-none placeholder:text-muted" placeholder="Convive, menu, allergene" />
            </div>
            <a routerLink="/services" class="rounded-full bg-accent text-white px-4 py-2 text-sm font-semibold shadow-soft">Nouveau service</a>
            <button type="button" (click)="logout()" class="rounded-full border border-stroke px-4 py-2 text-sm font-semibold">Deconnexion</button>
          </div>
        </div>
      </header>

      <main class="px-6 pb-12 md:px-10">
        <router-outlet />
      </main>
    </div>
  </div>
</div>
