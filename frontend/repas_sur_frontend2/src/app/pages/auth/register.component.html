<div class="min-h-screen flex items-center justify-center px-6">
  <div class="w-full max-w-md rounded-3xl border border-stroke bg-card p-8 shadow-soft">
    <h2 class="app-title text-2xl font-semibold">Inscription</h2>
    <p class="text-sm text-muted">Creer un acces pour votre equipe</p>

    <form class="mt-6 grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <input class="w-full rounded-xl border border-stroke px-4 py-3" placeholder="Nom d'utilisateur" formControlName="username" />
      <input class="w-full rounded-xl border border-stroke px-4 py-3" placeholder="Email" formControlName="email" />
      <input class="w-full rounded-xl border border-stroke px-4 py-3" type="password" placeholder="Mot de passe" formControlName="password" />
      <select class="w-full rounded-xl border border-stroke px-4 py-3" formControlName="role">
        <option value="ADMIN">ADMIN</option>
        <option value="RESPONSABLE">RESPONSABLE</option>
        <option value="CUISINE">CUISINE</option>
      </select>

      <p *ngIf="error" class="rounded-xl border border-accent2/40 bg-accent2/10 px-4 py-3 text-sm text-accent2">{{ error }}</p>

      <button type="submit" [disabled]="isLoading" class="rounded-full bg-night px-4 py-2 text-sm font-semibold text-white disabled:opacity-60">
        {{ isLoading ? 'Creation...' : 'Creer le compte' }}
      </button>
      <a routerLink="/login" class="text-sm text-muted">Deja un compte</a>
    </form>
  </div>
</div>
