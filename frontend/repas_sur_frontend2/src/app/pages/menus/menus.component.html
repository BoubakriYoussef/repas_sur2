<div class="flex items-center justify-between">
  <div>
    <h2 class="app-title text-2xl font-semibold">Menus</h2>
    <p class="text-sm text-muted">Composer les menus avec les plats disponibles</p>
  </div>
</div>

<form class="mt-6 grid gap-4 rounded-3xl border border-stroke bg-card p-6 shadow-soft" [formGroup]="form" (ngSubmit)="submit()">
  <div class="grid gap-4 md:grid-cols-3">
    <input class="w-full rounded-xl border border-stroke px-4 py-3" placeholder="Nom" formControlName="nom" />
    <input class="w-full rounded-xl border border-stroke px-4 py-3" placeholder="Description" formControlName="description" />
  </div>

  <div class="rounded-2xl border border-stroke p-4">
    <p class="text-xs uppercase tracking-[0.2em] text-muted">Plats</p>
    <div class="mt-3 grid gap-2 md:grid-cols-2">
      <label *ngFor="let plat of plats" class="flex items-center gap-2 text-sm">
        <input type="checkbox" [checked]="isPlatSelected(plat.id)" (change)="togglePlat(plat.id, $event.target.checked)" />
        <span>{{ plat.nom }}</span>
      </label>
    </div>
  </div>

  <div class="flex flex-wrap gap-3">
    <button type="submit" class="w-fit rounded-full bg-accent px-5 py-2 text-sm font-semibold text-white">
      {{ editingId ? 'Mettre a jour' : 'Ajouter menu' }}
    </button>
    <button type="button" class="w-fit rounded-full border border-stroke px-5 py-2 text-sm font-semibold" (click)="cancelEdit()" *ngIf="editingId">Annuler</button>
  </div>
</form>

<div class="mt-6 grid gap-4 md:grid-cols-2">
  <div *ngFor="let item of menus" class="rounded-2xl border border-stroke bg-card p-5 shadow-soft">
    <h3 class="app-title text-lg font-semibold">{{ item.nom }}</h3>
    <p class="text-sm text-muted">{{ item.description || '-' }}</p>
    <p class="mt-3 text-xs text-muted">Plats: {{ formatPlats(item) }}</p>
    <div class="mt-4 flex items-center gap-3 text-xs font-semibold">
      <button class="text-accent2" (click)="startEdit(item)">Modifier</button>
      <button class="text-accent2" (click)="remove(item.id)">Supprimer</button>
    </div>
  </div>
</div>
