<div class="flex items-center justify-between">
  <div>
    <h2 class="app-title text-2xl font-semibold">Services</h2>
    <p class="text-sm text-muted">Planification des repas collectifs</p>
  </div>
</div>

<form class="mt-6 grid gap-4 rounded-3xl border border-stroke bg-card p-6 shadow-soft" [formGroup]="form" (ngSubmit)="submit()">
  <div class="grid gap-4 md:grid-cols-3">
    <input type="datetime-local" class="w-full rounded-xl border border-stroke px-4 py-3" formControlName="dateService" />
    <select class="w-full rounded-xl border border-stroke px-4 py-3" formControlName="typeRepas">
      <option value="DEJEUNER">DEJEUNER</option>
      <option value="DINER">DINER</option>
    </select>
    <select class="w-full rounded-xl border border-stroke px-4 py-3" formControlName="statut">
      <option value="PREVU">PREVU</option>
      <option value="SERVI">SERVI</option>
      <option value="ANNULE">ANNULE</option>
    </select>
  </div>
  <div class="grid gap-4 md:grid-cols-2">
    <select class="w-full rounded-xl border border-stroke px-4 py-3" formControlName="siteId">
      <option *ngFor="let site of sites" [value]="site.id">{{ site.nom }}</option>
    </select>
    <select class="w-full rounded-xl border border-stroke px-4 py-3" formControlName="menuId">
      <option [ngValue]="null">Sans menu</option>
      <option *ngFor="let menu of menus" [ngValue]="menu.id">{{ menu.nom }}</option>
    </select>
  </div>
  <div class="flex flex-wrap gap-3">
    <button type="submit" class="w-fit rounded-full bg-accent px-5 py-2 text-sm font-semibold text-white">
      {{ editingId ? 'Mettre a jour' : 'Planifier' }}
    </button>
    <button type="button" class="w-fit rounded-full border border-stroke px-5 py-2 text-sm font-semibold" (click)="cancelEdit()" *ngIf="editingId">Annuler</button>
  </div>
</form>

<div class="mt-6 grid gap-4">
  <div *ngFor="let item of services" class="rounded-2xl border border-stroke bg-card p-5 shadow-soft flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <div>
      <p class="text-xs text-muted">{{ item.dateService | date:'short' }}</p>
      <p class="text-sm font-semibold">{{ item.typeRepas }} - {{ item.menu?.nom || 'Sans menu' }}</p>
      <p class="text-xs text-muted">Site: {{ item.site?.nom || '-' }}</p>
    </div>
    <div class="flex items-center gap-3">
      <span class="rounded-full border border-stroke px-3 py-1 text-xs">{{ item.statut }}</span>
      <button class="text-xs font-semibold text-accent2" (click)="startEdit(item)">Modifier</button>
      <button class="text-xs font-semibold text-accent2" (click)="remove(item.id)">Supprimer</button>
    </div>
  </div>
</div>
