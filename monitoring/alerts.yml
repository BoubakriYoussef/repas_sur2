groups:
  - name: repas-sur-availability
    rules:
      - alert: RepasSurBackendMetricsDown
        expr: up{job="repas-sur-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "RepasSûr : métriques backend indisponibles"
          description: "Prometheus ne peut plus collecter le backend depuis plus d'une minute."

      - alert: RepasSurEndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RepasSûr : endpoint indisponible"
          description: "La sonde HTTP vers {{ $labels.instance }} échoue depuis plus d'une minute."

      - alert: RepasSurHighHttp5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "RepasSûr : taux d'erreurs HTTP 5xx élevé"
          description: "Plus de 5 % des requêtes backend retournent une erreur 5xx depuis cinq minutes."

      - alert: RepasSurHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "RepasSûr : latence P95 élevée"
          description: "La latence P95 du backend dépasse une seconde depuis cinq minutes."
